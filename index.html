<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="w-full max-w-xl flex justify-between items-center mb-2">
        <h1 class="text-lg font-bold">WormGPT</h1>
        <button onclick="newChat()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-1 rounded text-sm transition">
            محادثة جديدة
        </button>
    </div>

    <!-- منطقة الشات -->
    <div id="chat-box" class="w-full max-w-xl flex-1 bg-gray-800 rounded-lg p-4 overflow-y-auto mb-4 flex flex-col gap-3 border border-gray-700">
    </div>

    <!-- منطقة الإدخال -->
    <div class="w-full max-w-xl flex gap-2">
        <input type="text" id="user-input" 
            class="flex-1 bg-gray-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 border border-gray-600"
            placeholder="اكتب رسالتك..."
            onkeypress="if(event.key === 'Enter') sendMessage()">
        
        <button onclick="sendMessage()" 
            class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-bold transition">
            إرسال
        </button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        // وظيفة زر محادثة جديدة
        function newChat() {
            chatBox.innerHTML = '';
        }

        function addMessage(text, isUser = false) {
            const div = document.createElement('div');
            div.className = `p-3 rounded-lg max-w-[85%] text-sm whitespace-pre-wrap ${
                isUser ? 'bg-blue-600 self-end rounded-tr-none' : 'bg-gray-700 self-start rounded-tl-none'
            }`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            userInput.value = '';

            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = 'text-gray-400 text-xs self-start';
            loadingDiv.textContent = 'جاري الرد...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                const data = await response.json();
                document.getElementById(loadingId).remove();
                addMessage(data.reply, false);
            } catch (error) {
                document.getElementById(loadingId).remove();
                addMessage("حدث خطأ في الاتصال.", false);
            }
        }
    </script>
</body>
</html>
